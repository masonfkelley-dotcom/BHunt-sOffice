<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brooklin Hunter's Office</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff7fb, #ffd3e7);
      color: #301622;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      width: min(430px, 100%);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(244, 92, 164, 0.25);
      border-radius: 28px;
      padding: 22px;
      box-shadow: 0 28px 70px rgba(182, 31, 106, 0.2);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 24px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 56px;
      height: 56px;
      border-radius: 17px;
      background: linear-gradient(135deg, #ffffff, #ffd3e7);
      border: 1px solid rgba(244, 92, 164, 0.45);
      color: #b61f6a;
      display: grid;
      place-items: center;
      font-size: 19px;
      font-weight: 900;
    }

    .title {
      font-size: 19px;
      font-weight: 800;
      line-height: 1.1;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(48, 22, 34, 0.58);
    }

    .icon-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 50%;
      background: rgba(244, 92, 164, 0.12);
      color: #301622;
      cursor: pointer;
      font-size: 18px;
    }

    .stage {
      min-height: 520px;
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      border: 1px solid rgba(244, 92, 164, 0.18);
      background:
        radial-gradient(circle at center, rgba(244, 92, 164, 0.18), transparent 58%),
        rgba(255, 255, 255, 0.55);
      padding: 22px;
      display: grid;
      grid-template-rows: auto auto 1fr auto auto;
      gap: 16px;
    }

    .watermark {
      position: absolute;
      right: -20px;
      top: 110px;
      font-size: 92px;
      font-weight: 900;
      color: rgba(182, 31, 106, 0.08);
      pointer-events: none;
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      position: relative;
      z-index: 2;
    }

    .status-text {
      font-size: 13px;
      font-weight: 700;
      color: rgba(48, 22, 34, 0.58);
    }

    .message-text {
      margin-top: 4px;
      font-size: 26px;
      font-weight: 900;
    }

    .result-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(244, 92, 164, 0.12);
      display: grid;
      place-items: center;
      font-size: 22px;
      font-weight: 900;
    }

    .hours {
      width: fit-content;
      border-radius: 999px;
      background: rgba(244, 92, 164, 0.12);
      padding: 9px 12px;
      font-size: 12px;
      font-weight: 800;
      color: rgba(48, 22, 34, 0.68);
      position: relative;
      z-index: 2;
    }

    .badge-area {
      display: grid;
      place-items: center;
      position: relative;
      z-index: 2;
    }

    .halo {
      position: absolute;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(244, 92, 164, 0.28), transparent 66%);
    }

    .badge-card {
      width: min(310px, 96%);
      aspect-ratio: 1.62;
      border: none;
      border-radius: 24px;
      padding: 22px;
      color: white;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.25), transparent 38%),
        linear-gradient(145deg, #f45ca4, #df4c95, #b61f6a);
      box-shadow: 0 28px 54px rgba(182, 31, 106, 0.25);
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }

    .card-logo {
      position: absolute;
      right: 16px;
      bottom: 12px;
      font-size: 54px;
      font-weight: 900;
      color: rgba(255,255,255,0.22);
    }

    .chip {
      width: 42px;
      height: 32px;
      border-radius: 9px;
      background: linear-gradient(#ffffff, #ffd3e7);
    }

    .badge-name {
      position: absolute;
      left: 22px;
      bottom: 30px;
      text-align: left;
    }

    .badge-name strong {
      display: block;
      font-size: 18px;
    }

    .badge-name span {
      display: block;
      margin-top: 5px;
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      position: relative;
      z-index: 2;
    }

    .action-btn {
      min-height: 54px;
      border: none;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
      cursor: pointer;
    }

    .face-btn {
      background: #b61f6a;
      color: white;
    }

    .doorbell-btn {
      background: linear-gradient(135deg, #ffffff, #ffd3e7);
      color: #b61f6a;
    }

    .visitor-btn {
      grid-column: 1 / -1;
      background: rgba(244, 92, 164, 0.12);
      color: #301622;
      border: 1px solid rgba(244, 92, 164, 0.2);
    }

    .meta {
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      color: rgba(48, 22, 34, 0.6);
      position: relative;
      z-index: 2;
    }

    .approved .result-icon {
      background: #35c759;
      color: white;
    }

    .denied .result-icon {
      background: #ff3b30;
      color: white;
    }

    .requesting .result-icon {
      background: #f45ca4;
      color: white;
    }

    @media (max-width: 430px) {
      .app {
        padding: 15px;
        border-radius: 24px;
      }

      .stage {
        min-height: 520px;
        padding: 18px;
      }

      .actions {
        grid-template-columns: 1fr;
      }

      .visitor-btn {
        grid-column: auto;
      }

      .message-text {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo">BH</div>
        <div>
          <div class="title">Brooklin Hunter's Office</div>
          <div class="subtitle">Private access</div>
        </div>
      </div>

      <button class="icon-btn" onclick="resetAccess()" aria-label="Reset">↻</button>
    </div>

    <section class="stage" id="panel">
      <div class="watermark">BH</div>

      <div class="status-row">
        <div>
          <div class="status-text" id="statusText">Ready to verify</div>
          <div class="message-text" id="messageText">Tap badge</div>
        </div>
        <div class="result-icon" id="resultIcon">⌁</div>
      </div>

      <div class="hours">Office open · 8 AM-6 PM</div>

      <div class="badge-area">
        <div class="halo"></div>

        <button class="badge-card" onclick="verifyBadge()">
          <div class="card-logo">BH</div>
          <div class="chip"></div>

          <div class="badge-name">
            <strong>Brooklin Hunter</strong>
            <span>Office badge</span>
          </div>
        </button>
      </div>

      <div class="actions">
        <button class="action-btn face-btn" onclick="faceId()">Face ID</button>
        <button class="action-btn doorbell-btn" onclick="doorbell()">Doorbell</button>
        <button class="action-btn visitor-btn" onclick="visitorRequest()">Visitor request</button>
      </div>

      <div class="meta" id="lastAccess">No recent attempts</div>
    </section>
  </main>

  <script>
    const panel = document.getElementById("panel");
    const statusText = document.getElementById("statusText");
    const messageText = document.getElementById("messageText");
    const resultIcon = document.getElementById("resultIcon");
    const lastAccess = document.getElementById("lastAccess");

    function verifyBadge() {
      const approved = Math.random() > 0.25;
      panel.className = approved ? "stage approved" : "stage denied";
      statusText.textContent = approved ? "Access granted" : "Access denied";
      messageText.textContent = approved ? "Welcome in" : "Not verified";
      resultIcon.textContent = approved ? "✓" : "×";
      lastAccess.textContent = approved
        ? "Last attempt: Approved by badge"
        : "Last attempt: Denied by badge";
    }

    function faceId() {
      const approved = Math.random() > 0.5;
      panel.className = approved ? "stage approved" : "stage denied";
      statusText.textContent = approved ? "Face verified" : "Face not verified";
      messageText.textContent = approved ? "Access granted" : "Access denied";
      resultIcon.textContent = approved ? "✓" : "×";
      lastAccess.textContent = approved
        ? "Last attempt: Approved by Face ID"
        : "Last attempt: Denied by Face ID";
    }

    function doorbell() {
      panel.className = "stage requesting";
      statusText.textContent = "Doorbell ringing";
      messageText.textContent = "Waiting for Brooklin";
      resultIcon.textContent = "!";
      lastAccess.textContent = "Brooklin notified";
    }

    function visitorRequest() {
      panel.className = "stage requesting";
      statusText.textContent = "Visitor request";
      messageText.textContent = "Approval pending";
      resultIcon.textContent = "!";
      lastAccess.textContent = "Visitor request sent";
    }

    function resetAccess() {
      panel.className = "stage";
      statusText.textContent = "Ready to verify";
      messageText.textContent = "Tap badge";
      resultIcon.textContent = "⌁";
      lastAccess.textContent = "No recent attempts";
    }
  </script>
</body>
</html>
